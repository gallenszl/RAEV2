stage_1:
  target: stage1.VGGTImageRAE
  params:
    vggt_repo_path: /home/zs3325/code/vggt-official
    vggt_ckpt_path: /home/zs3325/models/VGGT-1B/model.pt
    encoder_resolution: 448
    output_resolution: 512
    views_per_scene: 4
    mls_layers: [4, 11, 17, 23]
    vggt_embed_dim: 1024
    decoder_latent_dim: 768
    decoder_config_path: configs/decoder/ViTXL
    decoder_patch_size: 16
    pretrained_decoder_path: /home/zs3325/models/RAE-collections/decoders/dinov2/wReg_base/ViTXL_n08_i512/model.pt
    noise_tau: 0.8

dataset:
  target: objaverse_multiview
  type: multiview
  root: /scratch/zs3325/datasets/FluffyElephant
  list_path: /home/zs3325/code/RnG-fa3/data/objaverse_v1_in_lvis_25v.txt
  views_per_scene: 4
  total_views: 25
  seed: 20260616
  shared_tmpdir: /scratch/zs3325/tmp

training:
  epochs: 1
  ema_decay: 0.9978
  global_batch_size: 1
  grad_accum_steps: 1
  virtual_epoch_steps: 2
  num_workers: 0
  clip_grad: 0.0
  log_interval: 1
  checkpoint_interval: 1
  sample_every: 1000
  image_size: 512
  optimizer:
    lr: 5.0e-5
    betas: [0.9, 0.95]
    weight_decay: 0.0
  scheduler:
    type: cosine
    warmup_steps: 1
    decay_end_steps: 2
    base_lr: 5.0e-5
    final_lr: 5.0e-6
    warmup_from_zero: true

eval:
  eval_interval: 0
  eval_model: false
  eval_dir: results/stage1/eval
  datasets:
    gso:
      target: gso_multiview_fixed
      type: multiview
      root: /scratch/zs3325/datasets/FluffyElephant/gso_render_rv
      split_file: /home/zs3325/code/RnG-fa3/data/gso_subset64.txt
      fixed_view_list_path: configs/eval/gso_4view_fixed_seed0.json
      views_per_scene: 4
      total_views: 25
      num_samples: 2
      metrics: [psnr, ssim, lpips]

gan:
  arch:
    dino_ckpt_path: pretrained_models/encoders/dino/dino_vit_small_patch8_224.pth
    ks: 9
    norm_type: bn
    using_spec_norm: true
    recipe: S_8
  optimizer:
    lr: 2.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0
  scheduler: null
  augment:
    prob: 1.0
    cutout: 0.0
  loss:
    disc_loss: hinge
    gen_loss: vanilla
    disc_weight: 0.0
    perceptual_weight: 1.0
    disc_start: 1000
    disc_upd_start: 1000
    lpips_start: 0
    max_d_weight: 10000.0
    disc_updates: 1
